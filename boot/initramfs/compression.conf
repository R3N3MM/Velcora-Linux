# Compress initramfs images with xz instead of zstd.
#
# The image's kernel enables CONFIG_RD_XZ and CONFIG_XZ_DEC_X86; the main
# initramfs archive is about 15 MiB smaller with xz.  The ISO carries the
# initramfs twice (live boot and /boot inside the squashfs), so the saving is
# doubled, and kernel upgrades in an installed system keep producing xz
# initramfs images because this file ships in /etc.
COMPRESS=xz
