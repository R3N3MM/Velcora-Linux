# VELCORA LightDM greeter branding.
#
# Drop-in configuration for lightdm-gtk-greeter.  The greeter reads every
# file in this directory, so Debian's own defaults stay untouched.
[greeter]
background=/usr/share/backgrounds/velcora/velcora-default.jpg
icon-theme-name=Velcora
default-user-image=/usr/share/velcora/logo/velcora-logo.png
user-background=false
# Ask for the account name instead of showing a list of local users.  The
# installed system prompts for the name and password chosen in Calamares.
greeter-hide-users=true
